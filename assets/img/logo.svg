<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">E Analytics Studio</title>
  <!-- Structural mark: a minimal grid where the middle bar becomes an embedded arrow -->
  <g fill="none" stroke="#7F93AD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical spine -->
    <line x1="14" y1="12" x2="14" y2="52" />
    <!-- top bar -->
    <line x1="16" y1="16" x2="44" y2="16" />
    <!-- middle bar that becomes the arrow -->
    <line x1="16" y1="32" x2="48" y2="32" />
    <!-- arrow head integrated into middle bar (filled to match stroke) -->
    <polygon points="48,28 56,32 48,36" fill="#7F93AD" stroke="#7F93AD" />
    <!-- bottom bar -->
    <line x1="16" y1="48" x2="44" y2="48" />
  </g>
</svg>
